<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#254229" />
    <title>CARE 2.0 closed</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- Shown by the Close button when the browser does not let the page close its own tab. -->
    <style>
      html, body { margin: 0; height: 100%; background: #254229; font-family: "Open Sans", system-ui, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
      .card { background: #fff; border-radius: 24px; padding: 40px 48px; max-width: 460px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
      h1 { margin: 0 0 10px; font-size: 26px; color: #254229; }
      p { margin: 0 0 26px; color: #5F6B61; font-size: 17px; line-height: 1.5; }
      a { display: inline-block; background: #639850; color: #fff; text-decoration: none; border-radius: 999px; padding: 12px 34px; font-size: 17px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>CARE 2.0 is closed</h1>
      <p>You can close this browser tab now.</p>
      <a href="./">Reopen CARE 2.0</a>
    </div>
  </body>
</html>
